[pytest]
testpaths = tests
# 说明：
#   -p no:launch_ros / -p no:launch_testing
#     开发机若把 ROS2 的 site-packages 混入 PYTHONPATH，这两个 pytest 插件会在
#     收集阶段因缺少依赖而崩溃。显式禁用；插件不存在时该选项会被静默忽略。
addopts = -q -p no:launch_ros -p no:launch_testing
filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
